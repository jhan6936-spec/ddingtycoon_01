<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>띵타해 | 공예품 데이터 관리</title>
  <link rel="icon" href="assets/favicon/favicon-32x32.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
    <div class="mx-auto max-w-6xl px-4 py-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-lg font-semibold text-sky-300">공예품 데이터 관리</h1>
        <p class="text-xs text-slate-400 mt-1">로그인 후 사진만 올리면 띵타해 메인 사이트에 자동 반영</p>
      </div>
      <a href="index.html" class="text-sm text-sky-400 hover:text-sky-300 underline">← 메인 계산기</a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6 space-y-6">
    <section class="rounded-xl border border-slate-800 bg-slate-900/60 p-4 space-y-3">
      <h2 class="text-sm font-medium text-slate-300">관리자 인증</h2>
      <div class="flex flex-wrap items-end gap-3 max-w-xl">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs text-slate-400 mb-1" for="adminSecret">비밀번호</label>
          <input
            id="adminSecret"
            type="password"
            autocomplete="off"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm"
            placeholder="ADMIN_SECRET"
            aria-label="관리자 비밀번호"
          />
        </div>
        <button
          id="loginBtn"
          type="button"
          class="rounded-lg bg-sky-600 px-5 py-2 text-sm font-medium text-white hover:bg-sky-500 disabled:opacity-50"
        >
          로그인
        </button>
      </div>
      <p id="authMessage" class="text-sm text-slate-400" aria-live="polite"></p>
    </section>

    <section class="rounded-xl border border-slate-800 bg-slate-900/60 p-4 space-y-4">
      <h2 class="text-sm font-medium text-slate-300">공예 UI 스크린샷 업로드</h2>
      <div class="relative w-full">
        <div
          id="dropZone"
          tabindex="0"
          role="button"
          aria-label="이미지 업로드 영역"
          class="flex min-h-[280px] w-full cursor-pointer flex-col items-center justify-center rounded-lg border border-dashed border-slate-600 bg-slate-950/80 px-6 py-12 text-center text-sm text-slate-400 hover:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500 disabled:cursor-not-allowed disabled:opacity-50"
        >
          <p id="dropZoneTitle">로그인 후 스크린샷을 드래그하거나 클릭</p>
          <p class="text-xs mt-2 text-slate-500">업로드 즉시 분석 → 저장 → index.html 공예품 가격 반영</p>
        </div>
        <div id="pipelineOverlay" class="hidden absolute inset-0 flex items-center justify-center rounded-lg bg-slate-950/90">
          <div class="text-center px-4">
            <p class="text-sm text-sky-300 font-medium">자동 처리 중…</p>
            <p id="pipelineStep" class="text-xs text-slate-400 mt-2"></p>
          </div>
        </div>
      </div>
      <input id="imageInput" type="file" accept="image/*" class="hidden" aria-hidden="true" disabled />
      <img id="imagePreview" alt="업로드 미리보기" class="hidden max-h-80 w-full rounded-lg object-contain border border-slate-700" />
      <p id="statusMessage" class="text-sm text-slate-400" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
